services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: canlix
      POSTGRES_USER: canlix
      POSTGRES_PASSWORD: canlix
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canlix -d canlix"]
      interval: 5s
      timeout: 3s
      retries: 10
