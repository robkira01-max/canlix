[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpprobe"
version = "0.1.0"
description = "Open-source security scanner for MCP servers and AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "mcp",
    "model-context-protocol",
    "security",
    "ai-agents",
    "scanner",
    "devsecops",
    "claude",
    "prompt-injection",
    "static-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/robkira01-max/mcpprobe"
Source = "https://github.com/robkira01-max/mcpprobe"
"Bug Tracker" = "https://github.com/robkira01-max/mcpprobe/issues"
Changelog = "https://github.com/robkira01-max/mcpprobe/releases"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
mcpprobe = "mcpprobe.cli:app"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
