name: Canlix self-scan

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan the Canlix source with Canlix
        uses: ./
        with:
          path: canlix
          fail-on: CRITICAL
